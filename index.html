<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis 3D Dice Roller</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-top: 5px; }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

        #stage-container {
            width: 100%;
            max-width: 380px;
            height: 280px;
            position: relative;
            margin: 10px auto;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(30,27,75,0.7) 0%, rgba(15,23,42,0.95) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            cursor: pointer;
        }

        .dice-3d {
            width: 130px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .dice-face {
            position: absolute;
            width: 130px;
            height: 130px;
            background: rgba(30, 27, 75, 0.95);
            border: 3px solid #f472b6;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: inset 0 0 15px rgba(244, 114, 182, 0.4), 0 0 12px rgba(0,0,0,0.5);
            text-shadow: 0 0 10px #f472b6;
            backface-visibility: hidden;
            text-align: center;
            padding: 5px;
        }

        .face-front  { transform: rotateY(0deg) translateZ(65px); }
        .face-back   { transform: rotateY(180deg) translateZ(65px); }
        .face-right  { transform: rotateY(90deg) translateZ(65px); }
        .face-left   { transform: rotateY(-90deg) translateZ(65px); }
        .face-top    { transform: rotateX(90deg) translateZ(65px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(65px); }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .dice-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button.dice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.dice-btn:hover { background: rgba(255, 255, 255, 0.18); }
        button.dice-btn.active {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border-color: #f472b6;
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.6);
        }

        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .roll-btn:active { transform: scale(0.97); }

        #result-display {
            text-align: center;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
        }
        .result-val {
            font-size: 1.15rem;
            font-weight: 800;
            color: #f472b6;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎲 Aisea & Kostis Dice</h1>
        <div class="subtitle">Πλήρη 3D Ζάρια (d4 - d100)</div>
    </header>

    <div id="stage-container" onclick="rollDice()">
        <div class="dice-3d" id="dice-3d">
            <div class="dice-face face-front" id="f-1">1</div>
            <div class="dice-face face-back" id="f-2">2</div>
            <div class="dice-face face-right" id="f-3">3</div>
            <div class="dice-face face-left" id="f-4">4</div>
            <div class="dice-face face-top" id="f-5">5</div>
            <div class="dice-face face-bottom" id="f-6">6</div>
        </div>
    </div>

    <div class="controls-panel">
        <div>
            <div class="section-title">Επιλογή Ζαριού</div>
            <div class="dice-types">
                <button onclick="selectDice(4)" id="d4-btn" class="dice-btn">d4</button>
                <button onclick="selectDice(5)" id="d5-btn" class="dice-btn">d5</button>
                <button onclick="selectDice(6)" id="d6-btn" class="dice-btn active">d6</button>
                <button onclick="selectDice(8)" id="d8-btn" class="dice-btn">d8</button>
                <button onclick="selectDice(10)" id="d10-btn" class="dice-btn">d10</button>
                <button onclick="selectDice(12)" id="d12-btn" class="dice-btn">d12</button>
                <button onclick="selectDice(20)" id="d20-btn" class="dice-btn">d20</button>
                <button onclick="selectDice(100)" id="d100-btn" class="dice-btn">d100</button>
            </div>
        </div>

        <div id="result-display">
            <span class="result-val" id="result-text">Ρίξε το ζάρι για να δεις αποτέλεσμα!</span>
        </div>

        <button class="roll-btn" onclick="rollDice()">🎲 ΡΙΞΕ ΤΟ ΖΑΡΙ!</button>
    </div>

    <script>
        let currentSides = 6;
        let isRolling = false;
        let rotX = -20;
        let rotY = 25;

        const dice3d = document.getElementById('dice-3d');
        updateFaces(6);
        updateIdleRotation();

        function updateIdleRotation() {
            if (!isRolling) {
                rotY += 0.4;
                dice3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            }
            requestAnimationFrame(updateIdleRotation);
        }

        function updateFaces(sides) {
            // Γεμίζουμε τις 6 όψεις του 3D κύβου με τυχαία πιθανά νούμερα από το 1 έως το sides
            for (let i = 1; i <= 6; i++) {
                let sampleVal = Math.min(i, sides);
                if (sides === 100) sampleVal = i * 15 > 100 ? 100 : i * 15;
                document.getElementById(`f-${i}`).innerText = sampleVal;
            }
        }

        function selectDice(sides) {
            document.querySelectorAll('.dice-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`d${sides}-btn`).classList.add('active');
            currentSides = sides;

            updateFaces(sides);
            document.getElementById('result-text').innerText = `Επιλέχθηκε d${sides}. Ρίξε το ζάρι!`;
        }

        function rollDice() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('result-text').innerText = "Ρολάρει...";

            let startTime = performance.now();
            let targetRotX = rotX + 720 + Math.random() * 360;
            let targetRotY = rotY + 720 + Math.random() * 360;

            function animateRoll(now) {
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / 1200, 1);
                let easeOut = 1 - Math.pow(1 - progress, 3);

                let curX = rotX + (targetRotX - rotX) * easeOut;
                let curY = rotY + (targetRotY - rotY) * easeOut;
                dice3d.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animateRoll);
                } else {
                    rotX = curX % 360;
                    rotY = curY % 360;
                    isRolling = false;
                    finishRoll();
                }
            }
            requestAnimationFrame(animateRoll);
        }

        function finishRoll() {
            // Παραγωγή ΠΡΑΓΜΑΤΙΚΟΥ τυχαίου αποτελέσματος από 1 έως currentSides
            let result;
            if (currentSides === 100) {
                result = Math.floor(Math.random() * 100) + 1;
            } else {
                result = Math.floor(Math.random() * currentSides) + 1;
            }

            // Ενημέρωση όλων των πλευρών ώστε να περιέχουν έγκυρα νούμερα κοντά στο αποτέλεσμα
            for (let i = 1; i <= 6; i++) {
                let val = Math.floor(Math.random() * currentSides) + 1;
                document.getElementById(`f-${i}`).innerText = val;
            }
            // Η μπροστινή πλευρά δείχνει το ακριβές αποτέλεσμα
            document.getElementById('f-1').innerText = result;

            document.getElementById('result-text').innerText = `Αποτέλεσμα d${currentSides}: ${result}`;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 70, spread: 80, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
