<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis 3D Dice Roller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1 { font-size: 1.5rem; color: #f472b6; margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; text-align: center; }
        #canvas-container {
            width: 100%;
            max-width: 350px;
            height: 300px;
            border-radius: 20px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 15px 30px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
        }
        #result {
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f472b6;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <h1>🎲 Aisea & Kostis Dice</h1>
    <div class="subtitle">Magical 3D Decision Maker</div>

    <div id="canvas-container" onclick="rollDice()"></div>

    <button class="roll-btn" onclick="rollDice()">🎲 ΡΙΞΕ ΤΟ ΖΑΡΙ!</button>
    <div id="result">Pikse to zari!</div>

    <script>
        let scene, camera, renderer, cube;
        let isRolling = false;

        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(5, 5, 5);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const materials = [
                createFaceMat('1'),
                createFaceMat('2'),
                createFaceMat('3'),
                createFaceMat('4'),
                createFaceMat('5'),
                createFaceMat('6')
            ];

            cube = new THREE.Mesh(geometry, materials);
            scene.add(cube);

            animate();
        }

        function createFaceMat(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1e1b4b';
            ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#f472b6';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, 118, 118);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 60px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 64, 64);

            return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas) });
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isRolling && cube) {
                cube.rotation.x += 0.005;
                cube.rotation.y += 0.008;
            }
            renderer.render(scene, camera);
        }

        function rollDice() {
            if (isRolling || !cube) return;
            isRolling = true;
            document.getElementById('result').innerText = "Rolarei...";

            let start = performance.now();
            let randomX = cube.rotation.x + Math.PI * 4 + Math.random() * 5;
            let randomY = cube.rotation.y + Math.PI * 4 + Math.random() * 5;

            function spin(time) {
                let elapsed = time - start;
                let progress = Math.min(elapsed / 1200, 1);
                
                cube.rotation.x += (randomX - cube.rotation.x) * 0.1;
                cube.rotation.y += (randomY - cube.rotation.y) * 0.1;

                if (progress < 1) {
                    requestAnimationFrame(spin);
                } else {
                    isRolling = false;
                    let res = Math.floor(Math.random() * 6) + 1;
                    document.getElementById('result').innerText = "Apotelesma: " + res;
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 50, spread: 60, origin: { y: 0.6 } });
                    }
                }
            }
            requestAnimationFrame(spin);
        }

        window.onload = init;
    </script>
</body>
</html>
