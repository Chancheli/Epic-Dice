<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis Decision Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-top: 5px; }
        h1 {
            font-size: 1.4rem;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

        #stage-container {
            width: 100%;
            max-width: 380px;
            height: 200px;
            position: relative;
            margin: 8px auto 4px auto;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(30,27,75,0.7) 0%, rgba(15,23,42,0.95) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            cursor: pointer;
        }

        .dice-3d {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .dice-face {
            position: absolute;
            width: 100px;
            height: 100px;
            background: rgba(30, 27, 75, 0.95);
            border: 3px solid #f472b6;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            box-shadow: inset 0 0 15px rgba(244, 114, 182, 0.4), 0 0 12px rgba(0,0,0,0.5);
            text-shadow: 0 0 10px #f472b6;
            backface-visibility: hidden;
            text-align: center;
            padding: 5px;
        }

        .face-front  { transform: rotateY(0deg) translateZ(50px); }
        .face-back   { transform: rotateY(180deg) translateZ(50px); }
        .face-right  { transform: rotateY(90deg) translateZ(50px); }
        .face-left   { transform: rotateY(-90deg) translateZ(50px); }
        .face-top    { transform: rotateX(90deg) translateZ(50px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(50px); }

        #result-display {
            width: 100%;
            max-width: 380px;
            text-align: center;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 14px;
            border: 1px solid rgba(244, 114, 182, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            padding: 8px 14px;
            margin: 4px auto 8px auto;
        }
        .result-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: #f472b6;
            line-height: 1.3;
            text-align: center;
            width: 100%;
        }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 3px;
            font-weight: 700;
        }

        .dice-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }

        button.tool-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 7px 4px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.tool-btn:hover { background: rgba(255, 255, 255, 0.18); }
        button.tool-btn.active {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border-color: #f472b6;
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.6);
        }

        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: 800;
            padding: 12px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .roll-btn:active { transform: scale(0.97); }
    </style>
</head>
<body>

    <header>
        <h1>🎲 Aisea & Kostis Decision Hub</h1>
        <div class="subtitle">Ζάρια & Αποφάσεις για δύο!</div>
    </header>

    <!-- 1. ΚΟΥΤΙ ΜΕ ΤΟ 3D ΖΑΡΙ -->
    <div id="stage-container" onclick="rollAction()">
        <div class="dice-3d" id="dice-3d">
            <div class="dice-face face-front" id="f-1">🎲</div>
            <div class="dice-face face-back" id="f-2">A&K</div>
            <div class="dice-face face-right" id="f-3">❤️</div>
            <div class="dice-face face-left" id="f-4">🍕</div>
            <div class="dice-face face-top" id="f-5">🐱</div>
            <div class="dice-face face-bottom" id="f-6">✨</div>
        </div>
    </div>

    <!-- 2. ΚΕΝΤΡΙΚΟ ΠΛΑΙΣΙΟ ΑΠΟΤΕΛΕΣΜΑΤΟΣ (ΑΚΡΙΒΩΣ ΚΑΤΩ ΑΠΟ ΤΟ ΖΑΡΙ) -->
    <div id="result-display">
        <span class="result-val" id="result-text">Διάλεξε ζάρι ή mode και πάτα ρίψη!</span>
    </div>

    <!-- 3. ΧΕΙΡΙΣΤΗΡΙΑ & ΚΟΥΜΠΙΑ -->
    <div class="controls-panel">
        <div>
            <div class="section-title">Κλασικά Ζάρια</div>
            <div class="dice-types">
                <button onclick="selectDice(4)" id="d4-btn" class="tool-btn">d4</button>
                <button onclick="selectDice(5)" id="d5-btn" class="tool-btn">d5</button>
                <button onclick="selectDice(6)" id="d6-btn" class="tool-btn active">d6</button>
                <button onclick="selectDice(8)" id="d8-btn" class="tool-btn">d8</button>
                <button onclick="selectDice(10)" id="d10-btn" class="tool-btn">d10</button>
                <button onclick="selectDice(12)" id="d12-btn" class="tool-btn">d12</button>
                <button onclick="selectDice(20)" id="d20-btn" class="tool-btn">d20</button>
                <button onclick="selectDice(100)" id="d100-btn" class="tool-btn">d100</button>
            </div>
        </div>

        <div>
            <div class="section-title">Modes Αποφάσεων</div>
            <div class="modes-grid">
                <button onclick="selectMode('who')" id="mode-who-btn" class="tool-btn">1. Ποιος αποφασίζει;</button>
                <button onclick="selectMode('cookOrOrder')" id="mode-cookOrOrder-btn" class="tool-btn">2. Μαγείρεμα / Delivery</button>
                <button onclick="selectMode('cooking')" id="mode-cooking-btn" class="tool-btn">3. Τι μαγειρεύουμε;</button>
                <button onclick="selectMode('ordering')" id="mode-ordering-btn" class="tool-btn">4. Τι παραγγέλνουμε;</button>
                <button onclick="selectMode('activity')" id="mode-activity-btn" class="tool-btn" style="grid-column: span 2;">5. Τι κάνουμε σήμερα;</button>
            </div>
        </div>

        <button class="roll-btn" onclick="rollAction()">🎲 ΔΩΣΤΟ!!</button>
    </div>

    <script>
        let currentType = 'dice';
        let currentValue = 6;
        let isRolling = false;
        let rotX = -20;
        let rotY = 25;

        const dice3d = document.getElementById('dice-3d');
        updateIdleRotation();

        const modeIcons = {
            who: "👤",
            cookOrOrder: "🍳",
            cooking: "🍲",
            ordering: "🍕",
            activity: "🎬"
        };

        const modesData = {
            who: ["Κωστής", "Αϊσέα"],
            cookOrOrder: ["Μαγειρεύουμε", "Παραγγέλνουμεεεεεεε!!!!"],
            cooking: [
                "Γιουβέτσι κοτόπουλο", "Κοτόπουλο με ρύζι στο φούρνο", "Κοτόπουλο με σοτέ λαχανικά",
                "Μπιφτέκια με ό,τι βρεις", "Φιλέτο στήθος κοτόπουλο με πέστο βασιλικού",
                "Πανσετάκια με γλυκοκαυτερή σάλτσα μουστάρδας και λεμονιού", "Μπιφτέκια γαλοπούλας με sour cream & πατάτες",
                "Κοτόπουλο με ζυμαρικά σε σάλτσα ντομάτα-παρμεζάνα", "Γεμιστές πιπεριές στην κατσαρόλα με κρέμα φέτας",
                "Μακαρονόπιτα σουφλέ", "Ταϊλανδέζικο κοτόπουλο με κόκκινο κάρυ", "Μακαρόνια με τυριά στο φούρνο",
                "Burger", "Μακαρόνια με κιμά", "Μακαρόνια με Τόνο", "Fishsticks",
                "Κεφτεδάκια Ikea. Δεν έχεις??? ε ξαναρίξε ζάρι, τι με κοιτάς?!", "Chicken nuggets με πουρέ",
                "Παπουτσάκια με κιμά και ρύζι"
            ],
            ordering: ["Pizza", "Sushi", "Mac", "KFC", "Burger", "Σουβλάκι"],
            activity: ["Επιτραπέζιο", "Κονσόλα", "Σειρά", "Ταινία", "Βόλτα", "Σινεμά", "Φαγητό έξω"]
        };

        function updateIdleRotation() {
            if (!isRolling) {
                rotY += 0.4;
                dice3d.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            }
            requestAnimationFrame(updateIdleRotation);
        }

        function selectDice(sides) {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`d${sides}-btn`).classList.add('active');
            currentType = 'dice';
            currentValue = sides;
            document.getElementById('result-text').innerText = `Επιλέχθηκε d${sides}. Έτοιμο για ρίψη!`;
            document.getElementById('f-1').innerText = `d${sides}`;
        }

        function selectMode(modeKey) {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`mode-${modeKey}-btn`).classList.add('active');
            currentType = 'mode';
            currentValue = modeKey;
            document.getElementById('result-text').innerText = `Επιλέχθηκε κατηγορία! Πάτα ρίψη.`;
            document.getElementById('f-1').innerText = modeIcons[modeKey] || '✨';
        }

        function rollAction() {
            if (isRolling) return;
            isRolling = true;
            document.getElementById('result-text').innerText = "Αποφασίζει...";

            let startTime = performance.now();
            let targetRotX = rotX + 720 + Math.random() * 360;
            let targetRotY = rotY + 720 + Math.random() * 360;

            function animateRoll(now) {
                let elapsed = now - startTime;
                let progress = Math.min(elapsed / 1200, 1);
                let easeOut = 1 - Math.pow(1 - progress, 3);

                let curX = rotX + (targetRotX - rotX) * easeOut;
                let curY = rotY + (targetRotY - rotY) * easeOut;
                dice3d.style.transform = `rotateX(${curX}deg) rotateY(${curY}deg)`;

                if (progress < 1) {
                    requestAnimationFrame(animateRoll);
                } else {
                    rotX = curX % 360;
                    rotY = curY % 360;
                    isRolling = false;
                    finishRoll();
                }
            }
            requestAnimationFrame(animateRoll);
        }

        function finishRoll() {
            let finalResultText = "";

            if (currentType === 'dice') {
                let res = Math.floor(Math.random() * currentValue) + 1;
                finalResultText = `Αποτέλεσμα d${currentValue}: ${res}`;
                document.getElementById('f-1').innerText = res;
            } else {
                let options = modesData[currentValue];
                let chosen = options[Math.floor(Math.random() * options.length)];
                finalResultText = `✨ Απόφαση: ${chosen}`;
                document.getElementById('f-1').innerText = modeIcons[currentValue] || '✨';
            }

            document.getElementById('result-text').innerText = finalResultText;

            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 90, origin: { y: 0.6 } });
            }
        }
    </script>
</body>
</html>
