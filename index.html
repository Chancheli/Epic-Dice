<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis Dice Roller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-top: 5px; }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

        #canvas-container {
            width: 100%;
            max-width: 380px;
            height: 290px;
            position: relative;
            margin: 5px auto;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(30,27,75,0.7) 0%, rgba(15,23,42,0.95) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            cursor: pointer;
        }

        #dice-overlay-number {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px #f472b6, 0 0 30px #db2777;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            transition: opacity 0.2s ease;
        }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .dice-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button.dice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 8px 4px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.dice-btn:hover { background: rgba(255, 255, 255, 0.18); }
        button.dice-btn.active {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border-color: #f472b6;
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.6);
        }

        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .roll-btn:active { transform: scale(0.97); }

        #result-display {
            text-align: center;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 10px;
        }
        .result-val {
            font-size: 1.1rem;
            font-weight: 800;
            color: #f472b6;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎲 Aisea & Kostis Dice</h1>
        <div class="subtitle">3D Πολυεδρικά Ζάρια</div>
    </header>

    <div id="canvas-container" onclick="rollDice()">
        <div id="dice-overlay-number">6</div>
    </div>

    <div class="controls-panel">
        <div>
            <div class="section-title">Επιλογή Ζαριού</div>
            <div class="dice-types">
                <button onclick="selectDice(4)" id="d4-btn" class="dice-btn">d4</button>
                <button onclick="selectDice(5)" id="d5-btn" class="dice-btn">d5</button>
                <button onclick="selectDice(6)" id="d6-btn" class="dice-btn active">d6</button>
                <button onclick="selectDice(8)" id="d8-btn" class="dice-btn">d8</button>
                <button onclick="selectDice(10)" id="d10-btn" class="dice-btn">d10</button>
                <button onclick="selectDice(12)" id="d12-btn" class="dice-btn">d12</button>
                <button onclick="selectDice(20)" id="d20-btn" class="dice-btn">d20</button>
                <button onclick="selectDice(100)" id="d100-btn" class="dice-btn">d100</button>
            </div>
        </div>

        <div id="result-display">
            <span class="result-val" id="result-text">Πάτα το κουμπί ή κάνε κλικ στο ζάρι!</span>
        </div>

        <button class="roll-btn" onclick="rollDice()">🎲 ΡΙΞΕ ΤΟ ΖΑΡΙ!</button>
    </div>

    <script>
        let scene, camera, renderer, diceMesh, wireframeMesh;
        let currentSides = 6;
        let isRolling = false;
        let rollStartTime = 0;
        let rotSpeed = { x: 0, y: 0, z: 0 };

        function init3D() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 6;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);

            const dir1 = new THREE.DirectionalLight(0xf472b6, 1.5);
            dir1.position.set(5, 5, 5);
            scene.add(dir1);

            const dir2 = new THREE.DirectionalLight(0x60a5fa, 1.2);
            dir2.position.set(-5, -5, -2);
            scene.add(dir2);

            buildDice(6);
            animate();
        }

        function buildDice(sides) {
            if (diceMesh) scene.remove(diceMesh);
            if (wireframeMesh) scene.remove(wireframeMesh);
            currentSides = sides;

            let geom;
            if (sides === 4) geom = new THREE.TetrahedronGeometry(1.8);
