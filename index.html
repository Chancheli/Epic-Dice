<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis 3D Dice Roller</title>
    <!-- PWA & Mobile Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Dice%20Roller%22%2C%22short_name%22%3A%22Dice%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%23ec4899%22%7D">
    
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }
        header {
            text-align: center;
            margin-top: 5px;
        }
        h1 {
            font-size: 1.6rem;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        #canvas-container {
            width: 100%;
            max-width: 380px;
            height: 320px;
            position: relative;
            margin: 10px auto;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(30,27,75,0.7) 0%, rgba(15,23,42,0.95) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            cursor: pointer;
        }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .dice-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button.dice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 10px 4px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.dice-btn:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        button.dice-btn.active {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border-color: #f472b6;
            box-shadow: 0 0 12px rgba(219, 39, 119, 0.6);
        }

        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 15px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: transform 0.1s ease;
        }
        .roll-btn:active {
            transform: scale(0.97);
        }

        #result-display {
            text-align: center;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .result-val {
            font-size: 1.25rem;
            font-weight: 800;
            color: #f472b6;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎲 Aisea & Kostis Dice</h1>
        <div class="subtitle">3D Πολυεδρικά Ζάρια</div>
    </header>

    <div id="canvas-container"></div>

    <div class="controls-panel">
        <div>
            <div class="section-title">Επιλογή 3D Ζαριού</div>
            <div class="dice-types">
                <button onclick="selectDice(4)" id="d4-btn" class="dice-btn">d4</button>
                <button onclick="selectDice(5)" id="d5-btn" class="dice-btn">d5</button>
                <button onclick="selectDice(6)" id="d6-btn" class="dice-btn active">d6</button>
                <button onclick="selectDice(8)" id="d8-btn" class="dice-btn">d8</button>
                <button onclick="selectDice(10)" id="d10-btn" class="dice-btn">d10</button>
                <button onclick="selectDice(12)" id="d12-btn" class="dice-btn">d12</button>
                <button onclick="selectDice(20)" id="d20-btn" class="dice-btn">
