<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aisea & Kostis 3D Dice Roller</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            overflow-x: hidden;
        }
        header { text-align: center; margin-top: 5px; }
        h1 {
            font-size: 1.5rem;
            background: linear-gradient(to right, #f472b6, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }
        .subtitle { font-size: 0.8rem; color: #94a3b8; margin-top: 2px; }

        #canvas-container {
            width: 100%;
            max-width: 380px;
            height: 280px;
            position: relative;
            margin: 5px auto;
            border-radius: 20px;
            background: radial-gradient(circle, rgba(30,27,75,0.7) 0%, rgba(15,23,42,0.95) 100%);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            overflow: hidden;
            cursor: pointer;
        }

        .controls-panel {
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: 700;
        }

        .dice-types {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        button.dice-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            padding: 7px 4px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.dice-btn:hover { background: rgba(255, 255, 255, 0.18); }
        button.dice-btn.active {
            background: linear-gradient(135deg, #db2777, #9333ea);
            border-color: #f472b6;
            box-shadow: 0 0 10px rgba(219, 39, 119, 0.6);
        }

        .roll-btn {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 800;
            padding: 13px;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(236, 72, 153, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .roll-btn:active { transform: scale(0.97); }

        #result-display {
            text-align: center;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
